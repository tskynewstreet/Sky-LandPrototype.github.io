<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKY LAND — A Land of Total Freedom</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div id="start" class="screen">
  <div class="logo">SKY LAND</div>
  <div class="sub">A Land of Total Freedom</div>
  <div class="startbox">
    <b>SYSTEM START</b>
    <p>PLAYER DATA：未登録</p>
    <input id="nameInput" maxlength="12" placeholder="プレイヤー名を入力">
    <button type="button" id="startBtn">START</button>
  </div>
</div>

<div id="game" class="hidden">
<header><b>SKY LAND</b><span>LV <i id="lv">1</i>　EXP <i id="exp">0</i>　💠 <i id="coin">100</i>　DAY <i id="day">1</i></span></header>
<main>
<section id="world">
  <div class="sky"></div><div class="sea"></div><div class="sand"></div><div class="road"></div>
  <div class="city city1">🏠</div><div class="city city2">🏢</div><div class="tower">🕰️</div>
  <div id="player"><div class="hair"></div><div class="face">●</div><div class="body"></div></div>
  <button class="point p1" data-msg="古い看板だ。『時計塔を探せ』と書かれている。">看板</button>
  <button class="point p2" data-msg="砂の中に青い欠片が埋まっている。SYSTEM：UNKNOWN FRAGMENT">◆</button>
  <button class="point p3" data-msg="古い小屋。扉は固く閉ざされている。">小屋</button>
  <div id="hint">WASD / 矢印で歩く　・　クリック/タッチした場所へ歩く　・　青い場所を探索</div>
  <div id="touchControls">
    <button data-key="w">▲</button>
    <div><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div>
  </div>
</section>
<nav>
<button data-panel="profile">👤 PROFILE</button>
<button data-panel="test">🧠 TEST LAB</button>
<button data-panel="gacha">🎰 GACHA</button>
<button data-panel="story">📖 STORY</button>
<button data-panel="save">💾 SAVE</button>
</nav>
</main>
</div>

<div id="modal" class="hidden"><div class="modalbox"><button id="close">×</button><div id="modalContent"></div></div></div>
<script src="main.js"></script>
<script>
document.querySelectorAll('#touchControls button').forEach(btn => {
  const key = btn.dataset.key;
  const down = e => {
    e.preventDefault();
    keys[key] = true;
    P.target = null;
  };
  const up = e => {
    e.preventDefault();
    keys[key] = false;
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
});
</script>

<script>document.querySelectorAll("#touchControls button").forEach(b=>{const k=b.dataset.key;["pointerdown","touchstart"].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=true}));["pointerup","pointercancel","pointerleave","touchend"].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false}))});</script>
</body></html>
